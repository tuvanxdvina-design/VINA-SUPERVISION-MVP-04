# Kiểm thử tự động trên GitHub mỗi lần đẩy mã / mở PR.
# Chạy đúng 3 bộ như backend\scripts\kiem-tra-tat-ca.cmd (cú pháp giao diện + hồi quy + giao diện),
# trên PostgreSQL 16 dựng tạm và Google Chrome có sẵn của máy chạy GitHub — không đụng CSDL thật.
name: Kiem thu

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: kiem-thu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem-thu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Khóa ký phiên đăng nhập chỉ dùng cho lượt chạy này (backend từ chối chạy khi thiếu).
      JWT_SECRET: ci-only-${{ github.run_id }}-${{ github.run_attempt }}-khong-dung-o-may-that
      TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:5434/vina_regr_ci
      UI_TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:5434/vina_ui_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Cu phap giao dien + build khop
        run: node backend/scripts/check-frontend.js
      - name: Kiem bo tach js/
        run: node --test backend/tests/jsUnits.test.js
        working-directory: .
      - name: Hoi quy (API + CSDL)
        run: node --test tests/regression.test.js
        working-directory: backend
      - name: Giao dien (Chrome khong man hinh)
        run: node --test --test-reporter=spec tests/ui/all.test.js
        working-directory: backend
      - name: Luu anh loi giao dien
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts
          path: backend/tests/ui-artifacts/
          if-no-files-found: ignore
